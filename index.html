    <!-- Google tag (gtag.js), loaded after first paint (see below). Added 2026-09-15 so the SEO test has a
         measurement layer: Vercel Web Analytics was never enabled on the
         project, so every conversion event since 13 July was dropped. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      // Consent Mode v2, opt-out. Analytics storage is granted by default
      // (decision 2026-09-17: the opt-in banner left GA4 with 8 consenting
      // users in two weeks, too few to learn anything). Advertising signals
      // stay denied: we run no Google Ads. A visitor who opts out on /privacy
      // has 'denied' stored under ba-consent and is measured cookieless only.
      // The default MUST be set before config() or the first hit ignores it.
      var baOptOut = false;
      try { baOptOut = localStorage.getItem('ba-consent') === 'denied'; } catch (e) {}
      gtag('consent', 'default', {
        analytics_storage: baOptOut ? 'denied' : 'granted',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
      });
      gtag('js', new Date());
      gtag('config', 'G-VW901DS4HY');
      // gtag.js (~190 KB) is fetched after the load event, or on the first
      // scroll, tap or key press if that comes sooner. Loaded async in the head
      // it shared the mobile connection with the hero image and pushed LCP
      // out by over a second. Hits queued in dataLayer above are sent once it
      // arrives, so the page_view is not lost.
      (function () {
        var done = false;
        var evs = ['scroll', 'pointerdown', 'keydown', 'touchstart'];
        function loadGtag() {
          // Never during the prerender capture (headless Chrome under
          // automation): an injected tag would be baked into the static HTML
          // and gtag.js would then load twice for real visitors.
          if (done || navigator.webdriver) return;
          done = true;
          evs.forEach(function (e) { removeEventListener(e, loadGtag); });
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-VW901DS4HY';
          document.head.appendChild(s);
        }
        evs.forEach(function (e) { addEventListener(e, loadGtag, { once: true, passive: true }); });
        if (document.readyState === 'complete') loadGtag();
        else addEventListener('load', loadGtag, { once: true });
      })();
    </script>

    <!-- Pre-render: force all scroll-gated / framer-motion elements visible
         so their text is present in the static HTML captured by Puppeteer.
         The .prerendering class is injected only during the build step. -->
    <style>
      html.prerendering [data-animation],

    <!-- Fonts & performance. Manrope is self-hosted (variable 300-800, latin +
         latin-ext, copied from Google Fonts v23) so no third-party stylesheet
         blocks first paint. The latin file is preloaded because every page's
         LCP is text or sits under text set in Manrope. -->
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 300 800;
        font-display: swap;
        src: url(/fonts/manrope-latin-ext.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
